      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

      font-size: 24px;
      font-weight: 700;
      color: #ccd6f6;
    }

    .summary-card.highlight .summary-value {

    }

      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .filter-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: #8892b0;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .filter-tab:hover {
      color: #ccd6f6;
    }

    .filter-tab.active {
      background: rgba(100,255,218,0.1);
      color: #64ffda;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .action-btn {

      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.02);
      color: #a8b2d1;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;

    .action-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
      color: #fff;

      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      overflow-x: auto;
    }

    .appliance-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    .appliance-table th {
      background: rgba(0,0,0,0.3);
      padding: 16px 20px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64ffda;
      font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .appliance-table th:first-child {
      width: 50px;
      text-align: center;
    }

    .appliance-table td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: top;
      transition: all 0.2s ease;
    }

    .appliance-table tr {
      transition: all 0.2s ease;
    }

    .appliance-table tbody tr:hover {
      background: rgba(100,255,218,0.02);
    }

    .appliance-table tr.selected {
      background: rgba(100,255,218,0.05);
    }

    .appliance-table tr.selected td {
      border-color: rgba(100,255,218,0.1);
    }

    .checkbox-cell {
      text-align: center;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;

    .custom-checkbox:hover {
      border-color: #64ffda;
    }

    .custom-checkbox.checked {
      background: #64ffda;
      border-color: #64ffda;
    }

    .custom-checkbox svg {

    let currentFilter = 'all';

    function getFilteredData() {
      return currentFilter === 'all' 
        ? applianceData 
        : applianceData.filter(item => item.kitchen === currentFilter);
    }

    function updateSummary() {
      const selectedCount = selectedItems.size;
      const selectedTotal = applianceData
        .filter(item => selectedItems.has(item.id))
        .reduce((sum, item) => sum + item.priceMin, 0);

      document.getElementById('selected-count').textContent = selectedCount;
      document.getElementById('selected-total').textContent = '$' + selectedTotal.toLocaleString();
    }

          <td class="checkbox-cell">
            <div class="custom-checkbox ${selectedItems.has(item.id) ? 'checked' : ''}" data-id="${item.id}">
              <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                <path d="M1 5L4.5 8.5L11 1" stroke="#0c0c0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </td>
          <td>
            <span class="kitchen-badge ${item.kitchen.toLowerCase()}">${item.kitchen}</span>
          </td>
          <td>
            <div class="appliance-name">${item.appliance}</div>
          </td>
          <td>
            <div class="model-name">${item.model}</div>
            <div class="specs-text">${item.specs}</div>
          </td>
          <td>
            <div class="price-display">${item.price}</div>
          </td>
          <td>
            <div class="notes-text">${item.notes}</div>
          </td>
          <td>
            ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="link-btn ${item.kitchen === 'Ordered' ? 'frigidaire' : ''}">
              ${item.kitchen === 'Ordered' ? 'Frigidaire' : 'Costco'}
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M3.5 8.5L8.5 3.5M8.5 3.5H4.5M8.5 3.5V7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>` : `<span class="ordered-check">✓ Ordered</span>`}
          </td>
        </tr>
      `).join('');

      // Add click handlers to checkboxes
      document.querySelectorAll('.custom-checkbox').forEach(checkbox => {
        checkbox.addEventListener('click', function() {
          const id = parseInt(this.dataset.id);
          if (selectedItems.has(id)) {
            selectedItems.delete(id);
          } else {
            selectedItems.add(id);
          }
          renderTable();
          updateSummary();
        });
      });
    }

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderTable();
      });
    });

    // Select all button
    document.getElementById('select-all').addEventListener('click', function() {
      const filteredData = getFilteredData();
      filteredData.forEach(item => selectedItems.add(item.id));
      renderTable();
      updateSummary();
    });

    // Clear all button
    document.getElementById('clear-all').addEventListener('click', function() {
      selectedItems.clear();
      renderTable();
      updateSummary();
    });

    // Initial render
    renderTable();
    updateSummary();
  </script>
</body>
</html>
